# Filament load / unload for the StealthChanger (Mainsail / KlipperScreen "Load" and "Unload" buttons call
# LOAD_FILAMENT / UNLOAD_FILAMENT, which didn't exist in this config).
# Prepared 2026-10-26, re-checked 2026-11-12 against Klipper v0.13.0-827, KTC-easy 258, HelixScreen 1.0.8.
# Include after macros.cfg:  [include filament.cfg]
#
# HelixScreen: on a toolchanger its Load/Unload buttons mount/unmount the TOOL (SELECT_TOOL / UNSELECT_TOOL)
# unless you pick these macros yourself: Settings > Printing > Macro Buttons > Standard Macros >
# Load Filament = LOAD_FILAMENT, Unload Filament = UNLOAD_FILAMENT (not "(Auto)"). Then it heats the
# mounted tool, homes first if unhomed, and runs the macro with TEMP prefilled. Leave T blank and pick
# the tool with HelixScreen's tool switcher first.
#
# Usage:  LOAD_FILAMENT [T=<n>] [TEMP=<C>]     UNLOAD_FILAMENT [T=<n>] [TEMP=<C>]
#   - Works on the tool on the shuttle. T= picks that tool up first (printer must be homed).
#   - TEMP defaults to the tool's current target if it's hot enough to extrude, else default_temp.
#   - Refuses while a print is running; works while paused (runout / filament swap).
#
# TUNE fast_length: count how many 25 mm extrude clicks it takes today from "filament in the gears"
# to "plastic out of the nozzle", multiply by 25, subtract ~10 mm, and put that in fast_length.

[gcode_macro LOAD_FILAMENT]
description: Load filament into the active tool (or T=n). Optional TEMP=
variable_fast_length:  50     # mm, gears -> just above the melt zone, fast
variable_fast_speed:   10     # mm/s
variable_purge_length: 40     # mm, slow through the nozzle until the colour runs clean
variable_purge_speed:  3      # mm/s (~7 mm3/s on 1.75 mm filament)
variable_default_temp: 230    # C, used when the tool isn't already hot (PETG and PLA both load fine)
variable_z_lift:       10     # mm, lift before purging when not paused (keeps the blob off the bed/print)
gcode:
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("LOAD_FILAMENT: pause the print first") }
  {% endif %}
  {% if 'T' in params and params.T|int != printer.toolchanger.tool_number %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
      { action_raise_error("LOAD_FILAMENT: home the printer before asking for another tool") }
    {% endif %}
    T{params.T|int}
  {% endif %}
  _FILAMENT_RUN MODE=load {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active tool (or T=n). Optional TEMP=
variable_tip_push:       5    # mm, push a little first so the tip is fully molten
variable_tip_retract:    15   # mm, fast pull to shape the tip so it clears the gears and PTFE
variable_tip_speed:      40   # mm/s
variable_unload_length:  65   # mm, slow pull until the filament is clear of the gears
variable_unload_speed:   20   # mm/s
gcode:
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("UNLOAD_FILAMENT: pause the print first") }
  {% endif %}
  {% if 'T' in params and params.T|int != printer.toolchanger.tool_number %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
      { action_raise_error("UNLOAD_FILAMENT: home the printer before asking for another tool") }
    {% endif %}
    T{params.T|int}
  {% endif %}
  _FILAMENT_RUN MODE=unload {rawparams}

# Separate macro so the active extruder is read AFTER any tool change above.
[gcode_macro _FILAMENT_RUN]
gcode:
  {% set L = printer['gcode_macro LOAD_FILAMENT'] %}
  {% set U = printer['gcode_macro UNLOAD_FILAMENT'] %}
  {% set mode = params.MODE|default('load')|lower %}
  {% set ext = printer.toolhead.extruder %}
  {% if not ext %}
    { action_raise_error("No tool on the shuttle - pick one up (e.g. T0) or pass T=") }
  {% endif %}
  {% set min_t  = printer.configfile.settings[ext].min_extrude_temp|float %}
  {% set target = printer[ext].target|float %}
  {% set temp   = params.TEMP|default(target if target >= min_t else L.default_temp)|float %}
  {% set temp   = [temp, min_t + 10]|max %}
  {% set paused = printer.print_stats.state == 'paused' %}
  {% set pos    = printer.toolhead.position %}
  {% set zmax   = printer.toolhead.axis_maximum.z %}

  SAVE_GCODE_STATE NAME=_FILAMENT_STATE
  {% if 'xyz' in printer.toolhead.homed_axes and not paused and pos.z + L.z_lift <= zmax %}
    G91
    G1 Z{L.z_lift} F600
    G90
  {% endif %}

  RESPOND MSG="{mode|capitalize}ing {ext}: heating to {temp|int}C"
  M104 S{temp}
  TEMPERATURE_WAIT SENSOR={ext} MINIMUM={temp - 3}
  M83

  {% if mode == 'load' %}
    G1 E{L.fast_length}  F{L.fast_speed * 60}
    G1 E{L.purge_length} F{L.purge_speed * 60}
    G1 E-0.5 F1800          ; tiny retract to limit ooze
  {% else %}
    G1 E{U.tip_push}         F300
    G1 E-{U.tip_retract}     F{U.tip_speed * 60}
    G1 E-{U.unload_length}   F{U.unload_speed * 60}
  {% endif %}
  M400
  RESTORE_GCODE_STATE NAME=_FILAMENT_STATE
  RESPOND MSG="{mode|capitalize} done on {ext}. Heater left at {temp|int}C."
