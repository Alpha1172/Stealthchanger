# ~/printer_data/config/ukam/mcus.ini - UKAM (update_klipper_and_mcus) board list for Shane StealthChanger
# (UKAM reads it from there; replace the commented-out sample it created).
# No apostrophes anywhere in this file: UKAM passes every line, comments included, through xargs.
# Serials taken from printer.cfg and tools/T*.cfg (2026-10-26). Revised 2026-10-28, re-checked 2026-11-12.
#
# One-time prerequisites on the Pi:   sudo apt install dfu-util libusb-1.0-0-dev
# First run (shows each board build settings, keeps Klipper at its current version):
#     ~/ukam/ukam.sh -f -m
# After that (reuses the saved build settings):   ~/ukam/ukam.sh -f
#
# How flashing works here: "make flash FLASH_DEVICE=/dev/serial/by-id/..." asks the running Klipper
# firmware to reboot into its bootloader, then flashes over the same USB link. The Klipper flash script
# detects Katapult by itself if a board has it, otherwise it uses the the chip own ROM bootloader
# (STM32 DFU / RP2040 BOOTSEL). No buttons to press. The menuconfig bootloader setting must still be right.
#
# Not listed on purpose: [mcu cartographer]. Its firmware is not Klipper and is matched to the
# Cartographer plugin version.

# --- Manta M8P v2 (STM32H723) -------------------------------------------------
# menuconfig (BTT wiki): [*] extra low-level options / STM32 / STM32H723 / 128KiB bootloader /
#                        25 MHz crystal / USB (on PA11/PA12) / startup pins: leave empty
# Confirmed 2026-11-12: your last M8P build used FLASH_APPLICATION_ADDRESS=0x8020000 (128KiB), and the
# running firmware reports USB PA11/PA12 + crystal PH0/PH1 at 520 MHz (the H723 default).
# The 128KiB offset leaves the BTT bootloader in place (so the SD-card method still works as a fallback).
[m8p]
klipper_section: mcu
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_2B001D000651313239393734-if00

# --- Nitehawk-36 toolboards (RP2040, USB) - all four share one build ---------------
# menuconfig: [*] Enable extra low-level configuration options / Raspberry Pi RP2040/RP235x / rp2040 /
#             Bootloader offset: No bootloader / Flash chip: W25Q080 with CLKDIV 2 (default) /
#             Communication interface: USB / GPIO pins to set at micro-controller startup: !gpio8
#             (matches what the boards report today: INITIAL_PINS=!gpio8)
# "No bootloader": no Katapult on this Pi (no ~/katapult, bash history only shows plain `make flash`
# for these boards), and the -628 builds were flashed with that same plain make flash.
# T3 is listed first on purpose: on the FIRST run flash only T3, answer n for T0-T2, check T3 comes
# back on -827, then run `~/ukam/ukam.sh -f` again for the other three.
[nitehawk_t3]
klipper_section: mcu NHK3
config_name: nitehawk36
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3232323236190564-if00

[nitehawk_t0]
klipper_section: mcu nhkT0
config_name: nitehawk36
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_32323232361994B8-if00

[nitehawk_t1]
klipper_section: mcu NHK1
config_name: nitehawk36
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3232323236195530-if00

[nitehawk_t2]
klipper_section: mcu NHK2
config_name: nitehawk36
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3232323236190E55-if00

# 5th Nitehawk (future T4). Klipper does not load it today (noT5.cfg is not included), so UKAM cannot
# read its version. Uncomment once it is in use.
#[nitehawk_t4]
#klipper_section: mcu NHK5
#config_name: nitehawk36
#action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_32323232361946E6-if00

# --- CM5 Linux host MCU ---------------------------------------------------------
# menuconfig: Linux process
[cm5]
klipper_section: mcu CM5
action_command: make flash