# This file contains common pin mappings for the Nitehawk36 V1.4.
# To use this config, the firmware should be compiled for the 
# Raspberry Pi RP2040".

# change the mcu section name to the tool board you are configuring:
# NHK0, NHK3, etc.
[mcu NHK3]
serial:/dev/serial/by-id/usb-Klipper_rp2040_3232323236190564-if00
restart_method: command

# change the accelerometer section name to the tool you are configuring:
# T0, T3, etc.
[adxl345 T3]
cs_pin: NHK3:gpio27
spi_software_sclk_pin: NHK3:gpio18
spi_software_mosi_pin: NHK3:gpio20
spi_software_miso_pin: NHK3:gpio19
axes_map: x,z,y
#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor T3_filament]   # renamed 2026-11-12 (was a shared 'filament_sensor')
switch_pin: NHK3:gpio3
pause_on_runout: True

# change to the extruder section you are configuring:
# extruder, extruder1, etc.
[extruder3] # Orbiter2.5 with CHCB-V Hotend
step_pin: NHK3:gpio23
dir_pin: !NHK3:gpio24
enable_pin: !NHK3:gpio25
heater_pin: NHK3:gpio9
sensor_pin: NHK3:gpio29
pullup_resistor: 2200
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 47.482785792
gear_ratio: 9:1 # Reduction ratio (Galileo/Orbiter gear ratio 7.5:1, BMG is 50:17)
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 290
pressure_advance: 0.03
sensor_type: PT1000
max_extrude_only_distance: 120
control: pid
pid_Kp: 30.405 # Reduce gain to make response gentler
pid_Ki: 9.214  # Reduce accumulated correction
pid_Kd: 25.084     # Increase damping to resist sharp swings

# change the tmc2209 section name to match the extruder you are configuring:
# extruder, extruder1, etc.
[tmc2209 extruder3] # Orbiter2.5
uart_pin: NHK3:gpio0
tx_pin: NHK3:gpio1
sense_resistor: 0.100
run_current: 0.85
stealthchop_threshold: 0

# change the heater_fan section name to match the tool you are configuring:
# T0_hotend_fan, T3_hotend_fan, etc.
[heater_fan T3_hotend_fan]
pin: NHK3:gpio5
tachometer_pin: NHK3:gpio16
tachometer_ppr: 2
heater: extruder3 # change to match the extruder you are configuring: extruder, extruder1, etc.
heater_temp: 50.0

# change the fan_generic section name to the tool you are configuring:
# T0_partfan, T3_partfan, etc.
[fan_generic T3_part_fan]
pin: NHK3:gpio6

# change the tool section name to the tool you are configuring:
# T0, T3, etc.
[tool T3]
tool_number: 3 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder3 # change to match the extruder you are configuring: extruder, extruder1, etc.
fan: T3_part_fan
detection_pin: !NHK3:gpio10
#####################################################################
#####################################################################
#####################################################################
params_park_x: 224 # The absolute X-position of the tool in its dock.
params_park_y: 2.9 # The absolute Y-position of the tool in its dock.
params_park_z: 236 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
#####################################################################
#####################################################################
#####################################################################
gcode_x_offset: 0.470
gcode_y_offset: 0.590
gcode_z_offset: -0.184 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# Results from input shaper
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 52
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.2

# change the neopixel section name to the tool you are configuring:
# T0, T3, etc.
[neopixel T3]
pin: NHK3:gpio7
color_order: GRBW
chain_count: 23
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

# change the gcode_macro section name to the tool you are configuring:
# T0, T3, etc.
[gcode_macro T3]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    SELECT_TOOL T=3 # change to the index of the tool. 0, 1, 2, etc.