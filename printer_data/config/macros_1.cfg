# Renamed from PRINT_START: heatsoak.cfg's PRINT_START wrapper calls this after the soak.
# If you don't use heatsoak.cfg, rename it back to PRINT_START.
[gcode_macro _PRINT_START]
description: Start a print. TOOL= TOOL_TEMP= BED_TEMP= [T0_TEMP= .. T4_TEMP=]
# Warm-up temp for every tool the print uses while the bed heats and the
# gantry levels. Keep it below min_extrude_temp (170) so nothing oozes.
variable_preheat_temp: 150
# Touch-home Z on T0 after QGL (per Cartographer's PRINT_START template).
# Cartographer refuses touch above 150C (UNSAFE_max_touch_temperature), so T0 is held at touch_temp.
variable_use_touch: False
variable_touch_temp: 145
gcode:
  {% set TOOL = params.TOOL|default(0)|int %}
  {% set TOOL_TEMP = params.TOOL_TEMP|default(0)|int %}
  {% set BED_TEMP = params.BED_TEMP|default(0)|int %}

  # Tools this print uses -> first-layer temp (from Orca's Tn_TEMP params).
  # The initial tool is always included, so PRIME_LINES can find it.
  {% set temps = {} %}
  {% for tn in printer.toolchanger.tool_numbers %}
    {% set key = 'T' ~ tn|string ~ '_TEMP' %}
    {% if key in params %}
      {% set _ = temps.update({tn: params[key]|int}) %}
    {% endif %}
  {% endfor %}
  {% if TOOL not in temps and TOOL_TEMP > 0 %}
    {% set _ = temps.update({TOOL: TOOL_TEMP}) %}
  {% endif %}

  # Start the bed first (AC via SSR, not on the 24 V PSU) so it heats during everything below
  M140 S{BED_TEMP}

  M117 Homing
  G28
  T0 ; level and mesh with a tool on the shuttle (tool weight shifts QGL); T0 is the offset reference
  M400 ; let the pickup finish physically before arming crash detection
  START_TOOL_CRASH_DETECTION ; cekim tool_crash: e-stop if the tool leaves the shuttle (tool changes are ignored)

  # Warm the used tools below extrusion temp while the bed is still heating.
  # 350 W 24 V PSU vs 115 W Rapido 2 HF heaters: one ramp at a time.
  # Holding at temp is cheap; only the ramp draws full power.
  M117 Warming tools
  {% for tn in temps %}
    M104 T{tn} S{preheat_temp}
    TEMPERATURE_WAIT SENSOR={printer['tool T' ~ tn].extruder} MINIMUM={preheat_temp - 5}
  {% endfor %}
  {% if use_touch and 0 not in temps %}
    M104 T0 S{touch_temp} ; warm T0 for touch even if the print doesn't use it
  {% endif %}

  M117 Waiting for bed
  M190 S{BED_TEMP}

  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL
  G28 Z ; re-home Z after QGL (Cartographer scan)

  {% if use_touch %}
    M117 Touch home
    M109 T0 S{touch_temp} ; heat or cool T0 to touch temp, never above 150C
    STOP_TOOL_CRASH_DETECTION ; touch can lift the head off the magnets
    CARTOGRAPHER_TOUCH_HOME
    M400
    START_TOOL_CRASH_DETECTION
    {% if 0 not in temps %}
      M104 T0 S0 ; T0 not used in this print
    {% endif %}
  {% endif %}

  M117 Bed mesh
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Full first-layer temps. PRIME_LINES waits for each tool, primes it,
  # and finishes on the initial tool.
  {% for tn, t in temps.items() %}
    M104 T{tn} S{t}
    TEMPERATURE_WAIT SENSOR={printer['tool T' ~ tn].extruder} MINIMUM={t - 5} ; one ramp at a time (350 W PSU)
  {% endfor %}
  PRIME_LINES INITIAL_TOOL={TOOL}

  M117 Printing


[gcode_macro PRINT_END]
variable_z_lift: 10   # mm straight up off the part before anything else moves
gcode:
  {% set th = printer.toolhead %}
  {% set lift = [z_lift, th.axis_maximum.z - th.position.z - 1]|min %}

  M400
  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%
  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-2.0 F3600 ; retract filament

  # Lift straight up FIRST - before the tool change or any XY move - so the nozzle can't stay in the part.
  G91
  G1 Z{lift} F1200
  G90

  T0 ; put T0 back on the shuttle for the next print (Z is restored to the lifted height)

  G90 ; absolute positioning
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F6000 ; park at the rear, away from the docks

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater
  _RESET_LIMITS ; undo slicer accel/velocity limits
  STOP_TOOL_CRASH_DETECTION ; so handling tools by hand after the print doesn't e-stop

[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(20) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

[gcode_macro _RESET_LIMITS]
description: Restore printer.cfg speed limits (slicer first-layer limits otherwise stick after a cancel)
gcode:
  {% set p = printer.configfile.settings.printer %}
  SET_VELOCITY_LIMIT VELOCITY={p.max_velocity} ACCEL={p.max_accel} SQUARE_CORNER_VELOCITY={p.square_corner_velocity} MINIMUM_CRUISE_RATIO={p.minimum_cruise_ratio}

[gcode_macro _SC_CANCEL]
description: Runs from Mainsail's CANCEL_PRINT (user_cancel_macro), before CANCEL_PRINT_BASE
gcode:
  _RESET_LIMITS
  STOP_TOOL_CRASH_DETECTION

# Mainsail client settings (mainsail.cfg reads these; anything not listed keeps Mainsail's default)
[gcode_macro _CLIENT_VARIABLE]
variable_idle_timeout      : 3600         ; keep heaters/motors alive up to 1 h while paused (default 600 s kills them)
variable_user_cancel_macro : "_SC_CANCEL"
variable_park_at_cancel    : True         ; Mainsail default is False: cancel left the nozzle sitting in the part
variable_custom_park_dz    : 10.0         ; lift 10 mm (default 2) when parking on pause/cancel
variable_user_resume_macro : "_KTC_RESUME_CHECK" ; only used once mainsail.cfg is included after the toolchanger include
gcode:

# KTC-easy's own RESUME did these two checks; with Mainsail's RESUME restored they run from its hook.
[gcode_macro _KTC_RESUME_CHECK]
description: Re-detect the tool on the shuttle before resuming (called by Mainsail's RESUME)
gcode:
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED

# Orca's "Pause G-code" is M601, which Klipper doesn't know.
[gcode_macro M601]
description: Pause (Orca pause G-code)
gcode:
  PAUSE

# For HelixScreen's "Bed Level" button (it currently calls HELIX_BED_MESH_IF_NEEDED, which isn't installed).
[gcode_macro LEVEL_AND_MESH]
description: Home if needed, level the gantry with T0 on the shuttle, re-home Z, full bed mesh
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if printer.toolchanger.tool_number != 0 %}
    T0
  {% endif %}
  QUAD_GANTRY_LEVEL
  G28 Z
  BED_MESH_CALIBRATE

# --- klipper-backup (added by its installer on 2026-11-12; kept as-is) ---
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

